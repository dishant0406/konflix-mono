name: Deploy

# Deploys the stack to the single server that runs both apps.
#
# Images are built on the server, not here: the host is the only place with the CPU
# architecture they must run on, and it removes the need for a registry and an image
# transfer on every deploy. This workflow gets the code there, renders the
# configuration from secrets, and runs the deploy script.
#
# Every value that is not in the repository comes from a repository secret or
# variable. Nothing secret is ever written into a file that is committed.

on:
  push:
    branches: [main]
    # The desktop app is not part of what runs on the server. The server is built on the same
    # library (desktop/core) and lives in desktop/server, so those do deploy.
    paths-ignore:
      - desktop/app/**
      - desktop/assets/**
      - desktop/scripts/**
      - desktop/sources/**
      - desktop/README.md
      - branding/**
      - .github/workflows/desktop*.yml
  # Allows a deploy of any branch or commit without pushing a new commit.
  workflow_dispatch:

# A deploy in progress must not be interrupted halfway by the next push, and two
# deploys must never run at once. Queued runs are kept rather than cancelled, so the
# final state always matches the latest commit.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Reports whether the deploy target is configured, so a push to main on a
  # repository that has not been set up yet is a skip with instructions rather than a
  # failed run.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check the deploy secrets
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY CLOUDFLARE_TUNNEL_TOKEN; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Deploy skipped: not configured yet"
              echo
              echo "Missing repository secrets:$missing"
              echo
              echo "Add them under **Settings > Secrets and variables > Actions**, then"
              echo "re-run this workflow. See the Deployment section of README.md for the"
              echo "full one-time setup."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Deploy target is not configured. Missing:$missing"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

  # Runs the checks before anything is deployed.
  #
  # The pipeline previously went straight from checkout to rsync, so a commit that
  # failed its tests or did not build would still be deployed and only surface as a
  # broken site. The deploy job now waits on this one.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        # The lockfile is the source of truth, so the runner installs exactly what a
        # local build does. `npm ci` also fails on a lockfile that disagrees with
        # package.json, which is a real class of deploy break.
        run: npm ci

      - name: Test the frontend
        run: npm test --workspace=akidev

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit
        working-directory: akidev-frontend

      - name: Build the frontend
        run: npm run build

      - name: Install ffmpeg
        # The server's tests run the real conversion path against a generated file, so ffmpeg
        # must be present. Without it they say so and pass, which would hide a broken one.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Check the server
        working-directory: desktop
        run: |
          cargo fmt --all --check
          cargo clippy -p akidev-server -p akidev-core --all-targets -- -D warnings
          cargo test -p akidev-server -p akidev-core

  # Builds the server binary. It is compiled inside the Debian release the runtime image is
  # based on, so it links the same libc and OpenSSL it will run against, and it is built here
  # rather than on the host because a release build needs gigabytes of memory for minutes.
  build-server:
    needs: [preflight]
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    container: rust:1-bookworm
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Build
        working-directory: desktop
        run: cargo build --release --locked -p akidev-server

      - name: Check it starts
        # An executable that cannot start (a missing library, a wrong architecture) is found
        # here rather than on the host.
        run: |
          ldd desktop/target/release/akidev-server
          PORT=9 desktop/target/release/akidev-server --check || test $? -eq 1

      - uses: actions/upload-artifact@v4
        with:
          name: akidev-server
          path: desktop/target/release/akidev-server
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: [preflight, verify, build-server]
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Fetch the server binary
        # Into the build context of the api image, which only unpacks it.
        uses: actions/download-artifact@v4
        with:
          name: akidev-server
          path: desktop/server/dist

      - name: Make it executable
        run: chmod +x desktop/server/dist/akidev-server

      - name: Start ssh-agent
        # The key is passed through the agent rather than written to disk, so it is
        # not left behind on the runner and cannot end up in an artifact.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Started with the printed environment rather than `ssh-agent -a "$SSH_AUTH_SOCK"`:
          # SSH_AUTH_SOCK is not set on a GitHub runner, so passing it as the socket
          # path gave ssh-agent an empty argument and it exited non-zero. `eval` sets
          # the socket and the pid from the agent's own output.
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add - > /dev/null
          # The host key is recorded on first contact. The connection is key-only and
          # the target is pinned by DEPLOY_HOST, so this does not weaken it.
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || 22 }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          # Fails here, where the reason is readable, rather than at the first ssh
          # call with a bare exit code.
          ssh-add -l

      - name: Render the deploy environment
        # Written to the workspace only for the duration of the run and never
        # uploaded. The repository's .gitignore covers .env.deploy.
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_SITE_DOMAIN: ${{ vars.NEXT_PUBLIC_SITE_DOMAIN }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          TORBOX_API_KEY: ${{ secrets.TORBOX_API_KEY }}
          STREAM_SOURCES: ${{ vars.STREAM_SOURCES }}
          MAX_CACHE_BYTES: ${{ vars.MAX_CACHE_BYTES }}
        run: |
          # Defaults, so a missing repository variable does not silently deploy an
          # empty value.
          PUBLIC_URL="${PUBLIC_URL:-https://api.akidev.live}"
          NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-$PUBLIC_URL}"
          NEXT_PUBLIC_SITE_DOMAIN="${NEXT_PUBLIC_SITE_DOMAIN:-akidev.live}"
          STREAM_SOURCES="${STREAM_SOURCES:-debrid,torrent,archive-org}"
          MAX_CACHE_BYTES="${MAX_CACHE_BYTES:-12884901888}"

          umask 077
          cat > .env.deploy <<EOF
          PUBLIC_URL=$PUBLIC_URL
          NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL
          NEXT_PUBLIC_SITE_DOMAIN=$NEXT_PUBLIC_SITE_DOMAIN
          STREAM_SOURCES=$STREAM_SOURCES
          MAX_CACHE_BYTES=$MAX_CACHE_BYTES
          CLOUDFLARE_TUNNEL_TOKEN=$CLOUDFLARE_TUNNEL_TOKEN
          TORBOX_API_KEY=$TORBOX_API_KEY
          EOF

          # Only the shape is reported; the file holds the tunnel token and the
          # debrid key and must never be echoed.
          echo "Rendered .env.deploy with $(wc -l < .env.deploy) lines."

      - name: Upload the code
        # --delete keeps the server tree an exact copy of the commit, so a deleted
        # file does not linger and get built. .git travels with the code because the
        # deploy script tags images with the commit. The runtime env file is excluded
        # here and sent separately below, so its permissions can be set explicitly.
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.torrent-cache' \
            --exclude 'target' \
            --exclude 'desktop/app' \
            --exclude 'desktop/core' \
            --exclude 'desktop/vendor' \
            --exclude 'desktop/assets' \
            --exclude '.env' \
            --exclude '.env.*' \
            -e "ssh -p $DEPLOY_PORT" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/konflix/"

          scp -P "$DEPLOY_PORT" .env.deploy "$DEPLOY_USER@$DEPLOY_HOST:/opt/konflix/.env.deploy"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "chmod 600 /opt/konflix/.env.deploy"

      - name: Build and start
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /opt/konflix && git config --global --add safe.directory /opt/konflix && bash scripts/deploy.sh'

      - name: Verify the public endpoints
        # Verifies through Cloudflare rather than on the box, so this fails if DNS,
        # the tunnel, or TLS is wrong - not just if the containers started.
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          TV_URL: ${{ vars.TV_URL }}
          HUB_URL: ${{ vars.HUB_URL }}
        run: |
          PUBLIC_URL="${PUBLIC_URL:-https://api.akidev.live}"
          FRONTEND_URL="${FRONTEND_URL:-https://anime.akidev.live}"
          TV_URL="${TV_URL:-https://tv.akidev.live}"
          HUB_URL="${HUB_URL:-https://akidev.live}"

          echo "Checking $PUBLIC_URL/health"
          health=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$PUBLIC_URL/health")
          printf '%s\n' "$health" | head -c 400
          echo

          case "$health" in
            *'"status":"ok"'*) ;;
            *)
              echo "/health does not say ok" >&2
              exit 1
              ;;
          esac

          # Without ffmpeg only MP4 files play, and an MKV episode fails with a message that
          # sounds like a bad release. The image installs it, so this catches a broken image.
          case "$health" in
            *'"ffmpeg":true'*) ;;
            *)
              echo "/health does not report ffmpeg" >&2
              exit 1
              ;;
          esac

          # The stream sources must be the configured ones. The list is a repository
          # variable, and a variable that omits archive-org silently disables the
          # fallback that exists for the case no torrent indexer can cover - the app
          # keeps working and just reports "no source" for those titles.
          for source in torrent archive-org; do
            case "$health" in
              *"\"$source\""*) ;;
              *)
                echo "/health does not report $source as a stream source" >&2
                exit 1
                ;;
            esac
          done

          # One site on the bare zone, and the two retired hostnames send visitors to it.
          # A broken redirect would leave old anime. and tv. links dead while every check
          # above still passed.
          echo "Checking the site and the retired hostnames"
          body=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$HUB_URL")
          case "$body" in
            *"Akidev | Anime, series and films"*) echo "    site ok ($HUB_URL)" ;;
            *)
              echo "$HUB_URL did not serve the site (no expected title)" >&2
              exit 1
              ;;
          esac
          for check in "$FRONTEND_URL|$HUB_URL/anime" "$TV_URL|$HUB_URL/films"; do
            url="${check%%|*}"
            expected="${check#*|}"
            seen=$(curl -s -o /dev/null -w '%{http_code} %{redirect_url}' --retry 5 --retry-delay 5 --retry-all-errors "$url")
            if [ "$seen" != "308 $expected" ]; then
              echo "expected $url to redirect to $expected, got '$seen'" >&2
              exit 1
            fi
            echo "    $url -> $expected"
          done

          # The catalogue, through the routes the site uses. Each answers with the shape the
          # frontend reads, which a 200 alone does not prove.
          echo "Checking the catalogue"
          home=$(curl -fsS --retry 3 --retry-delay 5 --retry-all-errors "$PUBLIC_URL/v1/home")
          case "$home" in
            *'"featured":['*'"rows":['*) printf '%s' "$home" | head -c 160; echo ;;
            *)
              echo "/v1/home did not return featured and rows" >&2
              exit 1
              ;;
          esac
          for route in \
            "/v1/catalogue?kind=anime&sort=trending" \
            "/v1/catalogue?kind=series&genre=Drama" \
            "/v1/catalogue?kind=movie&sort=recent" \
            "/v1/search?q=naruto&limit=5" \
            "/v1/search?q=dangal&limit=5"
          do
            response=$(curl -fsS --retry 3 --retry-delay 5 --retry-all-errors "$PUBLIC_URL$route")
            case "$response" in
              *'"results":[{'*) echo "  $route -> results" ;;
              *)
                echo "$route returned no results: $response" >&2
                exit 1
                ;;
            esac
          done
          for route in "/v1/titles/anime-16498" "/v1/titles/series-169" "/v1/titles/movie-tt0111161"; do
            response=$(curl -fsS --retry 3 --retry-delay 5 --retry-all-errors "$PUBLIC_URL$route")
            case "$response" in
              *'"media":{'*) echo "  $route -> title" ;;
              *)
                echo "$route returned no title: $response" >&2
                exit 1
                ;;
            esac
          done

          # The routes the site itself serves. A build can succeed while every page 404s,
          # which a check of the home page alone would not catch.
          echo "Checking the site routes"
          for route in "/" "/anime" "/series" "/films" "/search?q=naruto" "/search?q=dangal" \
            "/title/anime-16498" "/title/movie-tt0111161" "/title/series-169" \
            "/watch/anime-130003/anime-130003-ep1"; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 --retry-all-errors "$HUB_URL$route")
            if [ "$code" != "200" ]; then
              echo "expected 200 from $HUB_URL$route, got $code" >&2
              exit 1
            fi
            echo "  $route -> $code"
          done

          # Finding a source is the volatile part, and it goes through the indexers, the
          # debrid service and the torrent engine together, so it is checked with real
          # titles. Each is one POST; the answer names the source and the delivery.
          play() {
            curl -sS --max-time 120 -X POST "$PUBLIC_URL/v1/play" \
              -H 'Content-Type: application/json' -d "{\"id\":\"$1\",\"hevc\":false}"
          }

          echo "Checking an episode resolves and can be fetched"
          anime=$(play anime-130003-ep1)
          case "$anime" in
            *'"available":true'*) ;;
            *)
              echo "the anime episode did not resolve: $anime" >&2
              exit 1
              ;;
          esac
          url=$(printf '%s' "$anime" | sed -n 's/.*"url":"\([^"]*\)".*/\1/p')
          kind=$(printf '%s' "$anime" | sed -n 's/.*"stream_type":"\([^"]*\)".*/\1/p')
          echo "  resolved as $kind via $(printf '%s' "$anime" | sed -n 's/.*"source":"\([^"]*\)".*/\1/p')"
          # The first bytes of the video, or the playlist: either proves the delivery route
          # answers, which a good resolve alone does not.
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 -H 'Range: bytes=0-1023' "$url")
          case "$code" in
            200|206) echo "  $url -> $code" ;;
            *)
              echo "expected the stream to answer, got $code from $url" >&2
              exit 1
              ;;
          esac

          # A season pack: the episode is one file of a torrent that holds a whole season,
          # which the file pick has to get right.
          echo "Checking a series episode resolves from a season pack"
          series=$(play series-tt26915338-s1e1)
          case "$series" in
            *'"available":true'*) echo "series resolved: $(printf '%s' "$series" | sed -n 's/.*"release":"\([^"]*\)".*/\1/p')" ;;
            *)
              echo "the series episode did not resolve: $series" >&2
              exit 1
              ;;
          esac

          # A title every text-search indexer answers with nothing, and the reason the
          # id-searched indexer exists. "India's Got Latent" is named three ways in the
          # wild, and no spelling finds it by text. It resolves only through torrentio,
          # which is searched by IMDb id with the season and episode in the path.
          echo "Checking a title that only the id-searched indexer can find"
          igl=$(play series-tt33094114-s1e1)
          case "$igl" in
            *'"available":true'*) echo "id-searched title resolved: $(printf '%s' "$igl" | sed -n 's/.*"release":"\([^"]*\)".*/\1/p')" ;;
            *)
              echo "the id-searched title did not resolve: $igl" >&2
              exit 1
              ;;
          esac

          # The season gate. A season pack's files restart at 01 for each season, so a pack
          # covering the wrong season must never be offered: "S02E01.mkv" is not episode 1 of
          # season 1. The show is a single season, so asking for season 9 must not fall back
          # to season 1's pack.
          echo "Checking a later season does not resolve to the wrong season"
          season9=$(play series-tt26915338-s9e1)
          case "$season9" in
            *'"available":false'*) echo "season 9 correctly found nothing" ;;
            *)
              echo "season 9 resolved: $season9" >&2
              exit 1
              ;;
          esac

          # The server must refuse what it should, and say so in JSON.
          echo "Checking the server refuses bad requests"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/s/not-a-real-token")
          if [ "$code" != "400" ]; then
            echo "expected 400 from /s for a malformed token, got $code" >&2
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/v1/catalogue?kind=books")
          if [ "$code" != "400" ]; then
            echo "expected 400 for an unknown kind, got $code" >&2
            exit 1
          fi

      - name: Report failure
        if: failure()
        run: |
          {
            echo "## Deploy failed"
            echo
            echo "If the build failed, the previous revision is still running unchanged."
            echo "If a container started and then failed its health check, that container is"
            echo "now the live one and the deploy did not roll back - inspect it on the host:"
            echo
            echo '```'
            echo "cd /opt/konflix && docker compose ps && docker compose logs --tail 100 api frontend"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
