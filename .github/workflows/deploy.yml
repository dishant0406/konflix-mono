name: Deploy

# Deploys the stack to the single server that runs both apps.
#
# Images are built on the server, not here: the host is the only place with the CPU
# architecture they must run on, and it removes the need for a registry and an image
# transfer on every deploy. This workflow gets the code there, renders the
# configuration from secrets, and runs the deploy script.
#
# Every value that is not in the repository comes from a repository secret or
# variable. Nothing secret is ever written into a file that is committed.

on:
  push:
    branches: [main]
  # Allows a deploy of any branch or commit without pushing a new commit.
  workflow_dispatch:

# A deploy in progress must not be interrupted halfway by the next push, and two
# deploys must never run at once. Queued runs are kept rather than cancelled, so the
# final state always matches the latest commit.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Reports whether the deploy target is configured, so a push to main on a
  # repository that has not been set up yet is a skip with instructions rather than a
  # failed run.
  preflight:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check the deploy secrets
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
        run: |
          missing=""
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY CLOUDFLARE_TUNNEL_TOKEN; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Deploy skipped: not configured yet"
              echo
              echo "Missing repository secrets:$missing"
              echo
              echo "Add them under **Settings > Secrets and variables > Actions**, then"
              echo "re-run this workflow. See the Deployment section of README.md for the"
              echo "full one-time setup."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "Deploy target is not configured. Missing:$missing"
            exit 0
          fi

          echo "configured=true" >> "$GITHUB_OUTPUT"

  # Runs the checks before anything is deployed.
  #
  # The pipeline previously went straight from checkout to rsync, so a commit that
  # failed its tests or did not build would still be deployed and only surface as a
  # broken site. The deploy job now waits on this one.
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        # The lockfile is the source of truth, so the runner installs exactly what a
        # local build does. `npm ci` also fails on a lockfile that disagrees with
        # package.json, which is a real class of deploy break.
        run: npm ci

      - name: Install ffmpeg
        # The stream tests exercise the real transcode path - they run ffprobe on a
        # generated file and ffmpeg on a real torrent read - so ffmpeg must be present.
        # The ubuntu runner image does not include it, and without it nine tests fail
        # with `spawnSync ffmpeg ENOENT` rather than skipping, which reads as a code
        # failure rather than a missing dependency.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit
        working-directory: konflix-frontend

      - name: Build the frontends
        # Both sites, because they are two builds of one codebase and the SITE argument
        # is what makes them differ. A build that only works for one of them would
        # otherwise be found on the server.
        run: |
          npm run build
          NEXT_PUBLIC_SITE=tv npm run build

  deploy:
    needs: [preflight, verify]
    if: needs.preflight.outputs.configured == 'true'
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Start ssh-agent
        # The key is passed through the agent rather than written to disk, so it is
        # not left behind on the runner and cannot end up in an artifact.
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          # Started with the printed environment rather than `ssh-agent -a "$SSH_AUTH_SOCK"`:
          # SSH_AUTH_SOCK is not set on a GitHub runner, so passing it as the socket
          # path gave ssh-agent an empty argument and it exited non-zero. `eval` sets
          # the socket and the pid from the agent's own output.
          eval "$(ssh-agent -s)"
          echo "SSH_AUTH_SOCK=$SSH_AUTH_SOCK" >> "$GITHUB_ENV"
          echo "SSH_AGENT_PID=$SSH_AGENT_PID" >> "$GITHUB_ENV"
          echo "$DEPLOY_SSH_KEY" | tr -d '\r' | ssh-add - > /dev/null
          # The host key is recorded on first contact. The connection is key-only and
          # the target is pinned by DEPLOY_HOST, so this does not weaken it.
          ssh-keyscan -p "${{ secrets.DEPLOY_PORT || 22 }}" -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts
          # Fails here, where the reason is readable, rather than at the first ssh
          # call with a bare exit code.
          ssh-add -l

      - name: Render the deploy environment
        # Written to the workspace only for the duration of the run and never
        # uploaded. The repository's .gitignore covers .env.deploy.
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          NEXT_PUBLIC_GRAPHQL_URI: ${{ vars.NEXT_PUBLIC_GRAPHQL_URI }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          TORBOX_API_KEY: ${{ secrets.TORBOX_API_KEY }}
          STREAM_SOURCES: ${{ vars.STREAM_SOURCES }}
          MAX_CACHE_BYTES: ${{ vars.MAX_CACHE_BYTES }}
        run: |
          # Defaults, so a missing repository variable does not silently deploy an
          # empty value.
          PUBLIC_URL="${PUBLIC_URL:-https://api.konflix.live}"
          NEXT_PUBLIC_GRAPHQL_URI="${NEXT_PUBLIC_GRAPHQL_URI:-$PUBLIC_URL/graphql}"
          STREAM_SOURCES="${STREAM_SOURCES:-debrid,torrent}"
          MAX_CACHE_BYTES="${MAX_CACHE_BYTES:-12884901888}"

          umask 077
          cat > .env.deploy <<EOF
          PUBLIC_URL=$PUBLIC_URL
          NEXT_PUBLIC_GRAPHQL_URI=$NEXT_PUBLIC_GRAPHQL_URI
          STREAM_SOURCES=$STREAM_SOURCES
          MAX_CACHE_BYTES=$MAX_CACHE_BYTES
          CLOUDFLARE_TUNNEL_TOKEN=$CLOUDFLARE_TUNNEL_TOKEN
          TORBOX_API_KEY=$TORBOX_API_KEY
          EOF

          # Only the shape is reported; the file holds the tunnel token and the
          # debrid key and must never be echoed.
          echo "Rendered .env.deploy with $(wc -l < .env.deploy) lines."

      - name: Upload the code
        # --delete keeps the server tree an exact copy of the commit, so a deleted
        # file does not linger and get built. .git travels with the code because the
        # deploy script tags images with the commit. The runtime env file is excluded
        # here and sent separately below, so its permissions can be set explicitly.
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude '.torrent-cache' \
            --exclude '.env' \
            --exclude '.env.*' \
            -e "ssh -p $DEPLOY_PORT" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:/opt/konflix/"

          scp -P "$DEPLOY_PORT" .env.deploy "$DEPLOY_USER@$DEPLOY_HOST:/opt/konflix/.env.deploy"
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "chmod 600 /opt/konflix/.env.deploy"

      - name: Build and start
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || 22 }}
        run: |
          ssh -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /opt/konflix && git config --global --add safe.directory /opt/konflix && bash scripts/deploy.sh'

      - name: Verify the public endpoints
        # Verifies through Cloudflare rather than on the box, so this fails if DNS,
        # the tunnel, or TLS is wrong - not just if the containers started.
        env:
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          TV_URL: ${{ vars.TV_URL }}
        run: |
          PUBLIC_URL="${PUBLIC_URL:-https://api.konflix.live}"
          FRONTEND_URL="${FRONTEND_URL:-https://anime.konflix.live}"
          TV_URL="${TV_URL:-https://tv.konflix.live}"

          echo "Checking $PUBLIC_URL/health"
          health=$(curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "$PUBLIC_URL/health")
          printf '%s\n' "$health" | head -c 400
          echo

          # Every content type must resolve to a provider. A misconfigured map is
          # invisible otherwise: the anime site keeps working while every film request
          # answers from the anime catalogue.
          for type in anime series movie; do
            case "$health" in
              *"\"$type\":"*) ;;
              *)
                echo "/health does not report a provider for $type" >&2
                exit 1
                ;;
            esac
          done

          echo "Checking $FRONTEND_URL"
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -o /dev/null -w 'HTTP %{http_code}\n' "$FRONTEND_URL"

          # A GraphQL round trip proves the frontend's API address and the API itself
          # both work, which a 200 on the home page alone does not.
          echo "Checking a GraphQL query"
          curl -fsS --retry 3 --retry-delay 5 --retry-all-errors \
            -X POST "$PUBLIC_URL/graphql" \
            -H 'Content-Type: application/json' \
            -d '{"query":"{ topAnime(page:1){ id title } }"}' | head -c 200
          echo

          # The fields the UI renders. A schema that loads but does not answer these
          # produces a frontend that builds and deploys and then shows nothing, which
          # a health check and a topAnime probe would both pass.
          #
          # Each body is a single-quoted literal so the inner \" stays valid JSON.
          # Building the body with an interpolated variable collapses the nested
          # quotes and the API answers 400.
          echo "Checking the media queries the frontend uses"
          for body in \
            '{"query":"{ mediaList(input:{sort:\"trending\",perPage:2}){ total results{ id title{ english } bannerImage } } }"}' \
            '{"query":"{ mediaSearch(term:\"naruto\", input:{perPage:2}){ total results{ id format } } }"}' \
            '{"query":"{ mediaDetail(id:\"anime-16498\"){ id description relations{ edges{ node{ id } } } recommendations{ nodes{ mediaRecommendation{ id } } } characters{ edges{ node{ name{ full } } } } } }"}' \
            '{"query":"{ mediaDetail(id:\"series-169\"){ id description episodeList{ episodeId season number } } }"}' \
            '{"query":"{ mediaSearch(term:\"dangal\", input:{contentType:\"movie\",perPage:2}){ total results{ id title{ english } } } }"}'
          do
            response=$(curl -fsS --retry 3 --retry-delay 5 --retry-all-errors \
              -X POST "$PUBLIC_URL/graphql" \
              -H 'Content-Type: application/json' \
              --data-binary "$body")
            case "$response" in
              *'"errors"'*)
                echo "GraphQL returned errors for: $body" >&2
                echo "$response" >&2
                exit 1
                ;;
            esac
            printf '%s\n' "$response" | head -c 120
            echo
          done

          # The routes themselves. A build can succeed while every page 404s, which a
          # check of the home page alone would not catch.
          #
          # Both sites are checked, because they are two builds of one codebase and a
          # site argument that broke would only show on one of them.
          echo "Checking the anime site routes"
          for route in "/" "/search?q=naruto" "/title/anime-16498" "/watch/anime-130003/anime-130003-ep1"; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 --retry-all-errors "$FRONTEND_URL$route")
            if [ "$code" != "200" ]; then
              echo "expected 200 from $FRONTEND_URL$route, got $code" >&2
              exit 1
            fi
            echo "  $route -> $code"
          done

          echo "Checking the tv site routes"
          for route in "/" "/search?q=dangal" "/title/movie-7691" "/title/series-169"; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 5 --retry-all-errors "$TV_URL$route")
            if [ "$code" != "200" ]; then
              echo "expected 200 from $TV_URL$route, got $code" >&2
              exit 1
            fi
            echo "  $route -> $code"
          done

          # The two sites must actually differ. A shared build would render the anime
          # home page on both hosts, which the route checks above would not notice.
          echo "Checking the two sites render different copy"
          anime_title=$(curl -fsS --retry 3 --retry-delay 5 --retry-all-errors "$FRONTEND_URL" | grep -o '<title>[^<]*</title>' | head -1)
          tv_title=$(curl -fsS --retry 3 --retry-delay 5 --retry-all-errors "$TV_URL" | grep -o '<title>[^<]*</title>' | head -1)
          echo "  anime: $anime_title"
          echo "  tv:    $tv_title"
          if [ "$anime_title" = "$tv_title" ]; then
            echo "both sites served the same title; the SITE build argument did not take effect" >&2
            exit 1
          fi

          # The delivery routes, which nothing else here exercises. A previous deploy
          # returned 200 on /health and a good GraphQL response while every request to
          # /dl threw a ReferenceError and surfaced at the edge as a 502, so the routes
          # themselves are what must be checked.
          echo "Checking the download route rejects a bad token"
          code=$(curl -s -o /dev/null -w '%{http_code}' "$PUBLIC_URL/dl/not-a-real-token")
          if [ "$code" != "400" ]; then
            echo "expected 400 from /dl for a malformed token, got $code" >&2
            exit 1
          fi

          echo "Checking an HLS episode resolves and serves a playlist"
          # The id is self-describing, so it names its own content type. The old bare
          # form ("130003-ep1") is no longer a media id and does not resolve.
          url=$(curl -fsS -X POST "$PUBLIC_URL/graphql" \
            -H 'Content-Type: application/json' \
            -d '{"query":"{ streamLinkDetails(id:\"anime-130003-ep1\"){ available streamType url } }"}' \
            | sed -n 's/.*"url":"\([^"]*\)".*/\1/p')
          if [ -z "$url" ]; then
            echo "no stream url was returned; the episode did not resolve" >&2
            exit 1
          fi
          # The first request starts the transcode, so this waits for the first segment.
          body=$(curl -fsS --max-time 120 --retry 2 --retry-delay 5 --retry-all-errors "$url")
          case "$body" in
            '#EXTM3U'*) echo "playlist served ($(printf '%s' "$body" | grep -c 'EXTINF') segments so far)" ;;
            *)
              echo "expected an HLS playlist from $url, got:" >&2
              printf '%s\n' "$body" | head -c 300 >&2
              exit 1
              ;;
          esac

      - name: Report failure
        if: failure()
        run: |
          {
            echo "## Deploy failed"
            echo
            echo "If the build failed, the previous revision is still running unchanged."
            echo "If a container started and then failed its health check, that container is"
            echo "now the live one and the deploy did not roll back - inspect it on the host:"
            echo
            echo '```'
            echo "cd /opt/konflix && docker compose ps && docker compose logs --tail 100 api frontend"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
