name: Desktop release

# Builds the macOS app and packs it into a disk image, kept as a workflow artifact.
#
# Run it by hand from the Actions tab, or push a tag named desktop-mac-v<version> (the version in
# desktop/app/Cargo.toml). The app is signed ad hoc: there is no Apple Developer ID yet, so
# macOS asks the first time it is opened, and the image carries a note that says how to
# answer. The image is for Apple silicon, because that is what the runner and its libmpv are.

on:
  workflow_dispatch:
  push:
    tags: ["desktop-mac-v*"]

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag names the version being built
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo pkgid -p akidev | sed 's/.*[#@]//')
          if [ "${GITHUB_REF_NAME}" != "desktop-mac-v${version}" ]; then
            echo "The tag is ${GITHUB_REF_NAME}, but the app is version ${version}." >&2
            exit 1
          fi

      - run: brew install mpv
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # With the signing secrets set, the app is signed with the Developer ID certificate and the
      # disk image is notarised by Apple. Without them the app is signed ad hoc, as before.
      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then echo "No signing certificate: the build is signed ad hoc."; exit 0; fi
          keychain="$RUNNER_TEMP/build.keychain"
          password=$(uuidgen)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          # Apple's intermediate certificate, which a fresh runner may not have.
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$RUNNER_TEMP/g2.cer"
          security import "$RUNNER_TEMP/g2.cer" -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          echo "SIGN_IDENTITY=Developer ID Application: Dishant Sharma (689N5CNAYJ)" >> "$GITHUB_ENV"
          if [ -n "$APPLE_API_KEY" ]; then
            echo "$APPLE_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
            echo "NOTARY_KEY_FILE=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
            echo "NOTARY_KEY_ID=${{ secrets.APPLE_API_KEY_ID }}" >> "$GITHUB_ENV"
            echo "NOTARY_ISSUER=${{ secrets.APPLE_API_ISSUER }}" >> "$GITHUB_ENV"
          fi

      - name: Build the app and the disk image
        run: ./scripts/dmg-macos.sh

      - name: Check what was built
        run: |
          dmg=$(ls target/release/bundle/*.dmg)
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -readonly > /dev/null
          trap 'hdiutil detach "$mount" > /dev/null' EXIT

          codesign --verify --deep --strict "$mount/Akidev.app"
          # When signed with a Developer ID and notarised, Gatekeeper must accept it as it is.
          if [ -n "${NOTARY_KEY_FILE:-}" ]; then
            spctl --assess --type exec -vv "$mount/Akidev.app"
            xcrun stapler validate "$dmg"
          fi

          # Everything the app loads must be inside it: a path into Homebrew would only work
          # on the machine that built it.
          if { otool -L "$mount/Akidev.app/Contents/MacOS/Akidev"; \
               find "$mount/Akidev.app" -name '*.dylib' -exec otool -L {} \; ; } \
               | grep -E '/opt/homebrew|/usr/local/'; then
            echo "The app still loads a library from outside itself." >&2
            exit 1
          fi
          # Named by the file alone, so `shasum -c` works from wherever it was downloaded to.
          (cd "$(dirname "$dmg")" && shasum -a 256 "$(basename "$dmg")" | tee "$(basename "$dmg").sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: akidev-macos-dmg
          path: |
            desktop/target/release/bundle/*.dmg
            desktop/target/release/bundle/*.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Say how to open it
        run: |
          {
            echo "## Akidev for macOS (Apple silicon)"
            echo
            echo "Download the **akidev-macos-dmg** artifact below, unzip it, open the disk image and drag"
            echo "Akidev onto Applications."
            echo
            echo "It is not signed with a Developer ID yet. The first time, macOS asks: open System"
            echo "Settings > Privacy & Security and press **Open Anyway**, or run"
            echo "\`xattr -dr com.apple.quarantine /Applications/Akidev.app\`."
          } >> "$GITHUB_STEP_SUMMARY"

      # A tag also makes a public release, which is where akidev.live/download points.
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls target/release/bundle/*.dmg target/release/bundle/*.dmg.sha256)
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --title "Akidev for macOS ${GITHUB_REF_NAME##*-v}" --notes "Open the disk image and drag Akidev onto Applications. Not yet signed with an Apple Developer ID: see https://akidev.live/download." --verify-tag
          gh release upload "$GITHUB_REF_NAME" $files --clobber
