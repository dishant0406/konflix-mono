name: Desktop release

# Builds the macOS app and packs it into a disk image, kept as a workflow artifact.
#
# Run it by hand from the Actions tab, or push a tag named desktop-v<version> (the version in
# desktop/app/Cargo.toml). The app is signed ad hoc: there is no Apple Developer ID yet, so
# macOS asks the first time it is opened, and the image carries a note that says how to
# answer. The image is for Apple silicon, because that is what the runner and its libmpv are.

on:
  workflow_dispatch:
  push:
    tags: ["desktop-v*"]

permissions:
  contents: read

jobs:
  dmg:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag names the version being built
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(cargo pkgid -p akidev | sed 's/.*[#@]//')
          if [ "${GITHUB_REF_NAME}" != "desktop-v${version}" ]; then
            echo "The tag is ${GITHUB_REF_NAME}, but the app is version ${version}." >&2
            exit 1
          fi

      - run: brew install mpv
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Build the app and the disk image
        run: ./scripts/dmg-macos.sh

      - name: Check what was built
        run: |
          dmg=$(ls target/release/bundle/*.dmg)
          mount=$(mktemp -d)
          hdiutil attach "$dmg" -mountpoint "$mount" -nobrowse -readonly > /dev/null
          trap 'hdiutil detach "$mount" > /dev/null' EXIT

          codesign --verify --deep --strict "$mount/Akidev.app"

          # Everything the app loads must be inside it: a path into Homebrew would only work
          # on the machine that built it.
          if { otool -L "$mount/Akidev.app/Contents/MacOS/Akidev"; \
               find "$mount/Akidev.app" -name '*.dylib' -exec otool -L {} \; ; } \
               | grep -E '/opt/homebrew|/usr/local/'; then
            echo "The app still loads a library from outside itself." >&2
            exit 1
          fi
          # Named by the file alone, so `shasum -c` works from wherever it was downloaded to.
          (cd "$(dirname "$dmg")" && shasum -a 256 "$(basename "$dmg")" | tee "$(basename "$dmg").sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: akidev-macos-dmg
          path: |
            desktop/target/release/bundle/*.dmg
            desktop/target/release/bundle/*.dmg.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Say how to open it
        run: |
          {
            echo "## Akidev for macOS (Apple silicon)"
            echo
            echo "Download the **akidev-macos-dmg** artifact below, unzip it, open the disk image and drag"
            echo "Akidev onto Applications."
            echo
            echo "It is not signed with a Developer ID yet. The first time, macOS asks: open System"
            echo "Settings > Privacy & Security and press **Open Anyway**, or run"
            echo "\`xattr -dr com.apple.quarantine /Applications/Akidev.app\`."
          } >> "$GITHUB_STEP_SUMMARY"
