name: Desktop

on:
  pull_request:
    paths: [desktop/**]
  push:
    branches: [main]
    paths: [desktop/**]

jobs:
  check:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - run: brew install mpv
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The same code on Windows: it must build and its tests must pass. The macOS job above is the
  # one that checks formatting and lints.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      # dumpbin and lib, which make the import library for libmpv, live in the Visual Studio tools.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build the app (this also fetches libmpv)
        shell: pwsh
        run: ./scripts/bundle-windows.ps1
      - name: Test
        shell: pwsh
        run: |
          $env:LIB = "$PWD\target\mpv;$env:LIB"
          $env:PATH = "$PWD\target\mpv;$env:PATH"
          cargo test -p akidev-core -p akidev
