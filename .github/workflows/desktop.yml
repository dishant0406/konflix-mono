name: Desktop

on:
  pull_request:
    paths: [desktop/**]
  push:
    branches: [main]
    paths: [desktop/**]

jobs:
  check:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - run: brew install mpv
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The same code on Windows: it must build and its tests must pass. The macOS job above is the
  # one that checks formatting and lints.
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop
      # dumpbin and lib, which make the import library for libmpv, live in the Visual Studio tools.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Inno Setup, for the installer
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build the app (this also fetches libmpv)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/bundle-windows.ps1
      - name: Test
        shell: pwsh
        run: |
          $env:LIB = "$PWD\target\mpv;$env:LIB"
          $env:PATH = "$PWD\target\mpv;$env:PATH"
          cargo test -p akidev-core -p akidev
      - name: Start it, wait, and take a picture
        # A runner has no GPU, so this can fail where a real PC would not: it reports and
        # does not fail the job.
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $app = Start-Process "target\release\bundle\Akidev\Akidev.exe" -PassThru
          Start-Sleep -Seconds 25
          if ($app.HasExited) { throw "Akidev exited with code $($app.ExitCode)" }
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $bitmap.Save("$PWD\target\release\bundle\windows-smoke.png")
          Stop-Process $app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: akidev-windows
          path: |
            desktop/target/release/bundle/*.zip
            desktop/target/release/bundle/*-setup.exe
            desktop/target/release/bundle/windows-smoke.png
          retention-days: 7
