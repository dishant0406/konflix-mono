name: Desktop release (Windows)

# Builds the Windows app, packs it into an installer and a zip, kept as workflow artifacts, then
# starts it once and keeps a screenshot as proof that it opens. The installer is signed through
# SignPath when the repository has the SignPath settings (see desktop/signing/README.md); without
# them it is left unsigned.
#
# Run it by hand from the Actions tab, or push a tag named desktop-windows-v<version> (the version in
# desktop/Cargo.toml).

on:
  workflow_dispatch:
  # Called by "Release desktop", which has made the tag already.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  push:
    tags: ["desktop-windows-v*"]

permissions:
  contents: write

# The tag being released: the one pushed, or the one "Release desktop" passes in. Empty on a
# hand-started run, which builds without publishing.
env:
  TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  zip:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Check the tag names the version being built
        if: env.TAG != ''
        shell: bash
        run: |
          version=$(cargo pkgid -p akidev | sed 's/.*[#@]//')
          if [ "${TAG}" != "desktop-windows-v${version}" ]; then
            echo "The tag is ${TAG}, but the app is version ${version}." >&2
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      # dumpbin and lib, which make the import library for libmpv, live in the Visual Studio tools.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install Inno Setup, for the installer
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build the app and the zip
        shell: pwsh
        run: ./scripts/bundle-windows.ps1

      - name: Start it, wait, and take a picture
        # A runner has no GPU, so this can fail where a real PC would not: it reports and
        # does not stop the release.
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $app = Start-Process "target\release\bundle\Akidev\Akidev.exe" -PassThru
          Start-Sleep -Seconds 25
          if ($app.HasExited) { throw "Akidev exited with code $($app.ExitCode)" }
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bitmap = New-Object System.Drawing.Bitmap $screen.Width, $screen.Height
          [System.Drawing.Graphics]::FromImage($bitmap).CopyFromScreen($screen.Location, [System.Drawing.Point]::Empty, $screen.Size)
          $bitmap.Save("$PWD\target\release\bundle\windows-smoke.png")
          Stop-Process $app

      # SignPath signs what it is sent as a GitHub artifact, so the installer goes up first.
      - name: Send the installer for signing
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: akidev-windows-unsigned
          path: desktop/target/release/bundle/*-setup.exe
          if-no-files-found: error
          retention-days: 1

      - name: Sign the installer (SignPath)
        id: signed
        if: env.SIGNPATH_API_TOKEN != ''
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: akidev
          signing-policy-slug: release-signing
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: desktop/target/signed

      - name: Put the signed installer in place of the unsigned one
        if: steps.signed.outcome == 'success'
        shell: pwsh
        run: |
          Copy-Item target\signed\*-setup.exe target\release\bundle\ -Force
          Get-AuthenticodeSignature target\release\bundle\*-setup.exe | Format-List Path, Status, SignerCertificate

      # The in-app updater checks the installer against this, after any signing.
      - name: Write the checksum of the installer
        shell: pwsh
        run: |
          Get-ChildItem target\release\bundle\*-setup.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" |
              Set-Content "$($_.FullName).sha256" -Encoding ascii -NoNewline
          }

      - uses: actions/upload-artifact@v4
        with:
          name: akidev-windows
          path: |
            desktop/target/release/bundle/*.zip
            desktop/target/release/bundle/*-setup.exe
            desktop/target/release/bundle/*-setup.exe.sha256
            desktop/target/release/bundle/windows-smoke.png
          if-no-files-found: error
          retention-days: 30

      # A tag also makes a public release, which is where akidev.live/download points.
      - name: Publish the release
        if: env.TAG != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || gh release create "$TAG" --title "Akidev for Windows ${TAG##*-v}" --notes "Run the installer. See https://akidev.live/download for how the installer is signed." --verify-tag
          gh release upload "$TAG" target/release/bundle/*-setup.exe target/release/bundle/*-setup.exe.sha256 target/release/bundle/Akidev-*-x86_64.zip --clobber
