type Query {
  topAnime(page: Int): [Anime]
  recentEpisodes(page: Int): [Recent]
  animeDetails(id: ID): AnimeDetails
  # contentType selects which provider answers and which indexers are searched, so
  # the same three media fields serve the anime, series and movie sites.
  streamLinkDetails(id: ID, contentType: String): StreamLink
  animeSearch(id: ID, page: Int): [Anime]
  recommandedAnime(genre: String): [Recommanded]
  mediaList(input: MediaListInput): MediaPage
  mediaSearch(input: MediaListInput, term: String): MediaPage
  mediaDetail(id: ID): MediaFull
}

type Anime {
  id: ID
  title: String
  trailer: String
  imgUrl: String
}

type Recommanded {
  animeId: ID
  animeTitle: String
  animeImg: String
}

type Recent {
  animeId: ID
  episodeId: ID
  name: String
  episodeNum: Int
  subOrDub: String
  imgUrl: String
}

type AnimeDetails {
  id: ID
  name: String
  type: String
  status: String
  totalEpisodes: Int
  released: Int
  genres: [String]
  synopsis: String
  imageUrl: String
  episode_id: [EpisodeID]
  trailer: String
  # Every title this show is known by. Releases are named inconsistently - an
  # English title ("Attack on Titan") and its romaji ("Shingeki no Kyojin") both
  # appear - so relevance is checked against all of them.
  titleVariants: [String]
}

type EpisodeID {
  episodeId: ID
  episodeNumber: Int
}

# A playable source for one episode.
#
# `available` is false when no release could be found or played, in which case
# `reason` explains why. That is a normal outcome for this layer, not an error, so
# the UI can always render something truthful instead of a broken player.
type StreamLink {
  id: ID
  url: String
  # "file" for bytes the browser plays directly, "hls" for a release that had to be
  # converted (an MKV) and is served as a playlist.
  streamType: String
  available: Boolean
  reason: String
  release: String
  animeNameWithEP: String
  ep_num: Int
  anime_info: String
}

# ---------------------------------------------------------------------------
# Full media shapes, rendered directly by the frontend.
#
# AniList is the source of truth for these fields, so they mirror AniList's
# `Media` object rather than being re-invented. The small shapes above remain
# because the stream layer depends on them and they are the stable contract.
# ---------------------------------------------------------------------------

input MediaListInput {
  # "anime" (default), "series" or "movie". Selects the provider.
  contentType: String
  sort: String
  # A single genre, used by the home page rows.
  genre: String
  # Several genres at once, used by the search filters.
  genres: [String]
  format: String
  status: String
  season: String
  year: Int
  page: Int
  perPage: Int
}

type MediaTitle {
  romaji: String
  english: String
  native: String
}

type MediaCoverImage {
  extraLarge: String
  large: String
  color: String
}

type MediaDate {
  year: Int
  month: Int
  day: Int
}

type MediaStudio {
  id: ID
  name: String
  isAnimationStudio: Boolean
  siteUrl: String
}

type MediaStudios {
  nodes: [MediaStudio]
}

type MediaNextAiringEpisode {
  episode: Int
  airingAt: Int
  timeUntilAiring: Int
}

# The shape every card, carousel and hero banner renders.
type MediaList {
  id: ID
  title: MediaTitle
  coverImage: MediaCoverImage
  bannerImage: String
  format: String
  season: String
  seasonYear: Int
  episodes: Int
  duration: Int
  status: String
  averageScore: Int
  meanScore: Int
  popularity: Int
  favourites: Int
  genres: [String]
  source: String
  countryOfOrigin: String
  isAdult: Boolean
  studios: MediaStudios
  nextAiringEpisode: MediaNextAiringEpisode
  startDate: MediaDate
  endDate: MediaDate
}

type MediaPage {
  page: Int
  perPage: Int
  total: Int
  hasNextPage: Boolean
  results: [MediaList]
}

type MediaTrailer {
  id: String
  site: String
}

type MediaRelationNode {
  id: ID
  type: String
  format: String
  status: String
  episodes: Int
  meanScore: Int
  averageScore: Int
  popularity: Int
  genres: [String]
  title: MediaTitle
  coverImage: MediaCoverImage
  startDate: MediaDate
}

type MediaRelationEdge {
  relationType: String
  node: MediaRelationNode
}

type MediaRelations {
  edges: [MediaRelationEdge]
}

type MediaRecommendationNode {
  rating: Int
  mediaRecommendation: MediaRelationNode
}

type MediaRecommendation {
  nodes: [MediaRecommendationNode]
}

type MediaCharacterName {
  full: String
  native: String
}

type MediaImage {
  large: String
}

type MediaVoiceActor {
  id: ID
  name: MediaCharacterName
  image: MediaImage
  languageV2: String
}

type MediaCharacterNode {
  id: ID
  name: MediaCharacterName
  image: MediaImage
}

type MediaCharacterEdge {
  role: String
  node: MediaCharacterNode
  voiceActors: [MediaVoiceActor]
}

type MediaCharacters {
  edges: [MediaCharacterEdge]
}

# One episode of a series.
#
# Present only for a provider that supplies an episode list (TVMaze). AniList reports
# a flat count instead, so an anime has no such list and the UI falls back to counting
# from 1. `episodeId` is already self-describing, so the watch page can route from it.
type MediaEpisode {
  episodeId: ID
  season: Int
  number: Int
  name: String
  airdate: String
}

type MediaExternalLink {
  url: String
  site: String
  type: String
}

type MediaStreamingEpisode {
  title: String
  thumbnail: String
  url: String
  site: String
}

# MediaList plus the fields only the detail page needs, so a grid of cards does
# not pay for them.
type MediaFull {
  id: ID
  title: MediaTitle
  coverImage: MediaCoverImage
  bannerImage: String
  format: String
  season: String
  seasonYear: Int
  episodes: Int
  duration: Int
  status: String
  averageScore: Int
  meanScore: Int
  popularity: Int
  favourites: Int
  genres: [String]
  source: String
  countryOfOrigin: String
  isAdult: Boolean
  studios: MediaStudios
  nextAiringEpisode: MediaNextAiringEpisode
  startDate: MediaDate
  endDate: MediaDate
  idMal: Int
  description: String
  trailer: MediaTrailer
  relations: MediaRelations
  recommendations: MediaRecommendation
  characters: MediaCharacters
  externalLinks: [MediaExternalLink]
  streamingEpisodes: [MediaStreamingEpisode]
  # Absent for an anime; see MediaEpisode.
  episodeList: [MediaEpisode]
}
