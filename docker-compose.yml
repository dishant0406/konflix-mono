# Akidev production stack: one server, three containers.
#
#   cloudflared    the only thing exposed to the internet, over an outbound tunnel.
#                  Nothing binds a public port, so there is no open firewall hole and
#                  no certificate to renew on this box.
#   api            the REST API and the video delivery, one Rust binary built on the same
#                  library as the desktop app (port 9000, internal only).
#   frontend       every site (port 3000, internal only).
#
# Four hostnames reach the same tunnel and are routed by hostname in the tunnel's
# ingress config (scripts/cloudflare.sh), which is why no reverse proxy is needed
# here. Each site talks to the API directly on api.akidev.live, so no proxy sits in
# the video byte path.
#
# One container serves all of them. The bare zone is the site, with Anime, Series and Films
# tabs. anime. and tv. are retired: the middleware (src/middleware.ts) redirects them to the
# matching page of the bare zone, so old links keep working.
#
# Every value comes from the environment. The deploy script renders an env file from
# GitHub Actions secrets and passes it with --env-file, so no secret is ever written
# into this file or into the repository.

# The project name, the image names, /opt/konflix and the deploy user on the server date from
# before the rename to Akidev. They are names on the running host, so changing them is a server
# migration and not part of a rebrand.
name: konflix

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    environment:
      # Passed as an environment variable rather than a `--token` argument, so the
      # secret is not visible in the host process list.
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    command: tunnel --no-autoupdate run
    depends_on:
      - api
      - frontend
    logging: &logging
      # Bounded, because the disk is a fixed size and a chatty container would
      # otherwise fill it. The default json-file driver has no limit.
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    image: ${API_IMAGE}
    build:
      # Only the Dockerfile and the binary the deploy workflow built into dist/. See the Dockerfile
      # for why it is not compiled here.
      context: desktop/server
    restart: unless-stopped
    environment:
      PORT: 9000
      # Stream URLs are built from this, so it must be the public API origin.
      PUBLIC_URL: ${PUBLIC_URL}
      # The browser calls the API from the site, so that origin must be allowed.
      CORS_ORIGINS: https://${NEXT_PUBLIC_SITE_DOMAIN:-akidev.live}
      CACHE_DIR: /data
      STREAM_SOURCES: ${STREAM_SOURCES:-debrid,torrent,archive-org}
      TORBOX_API_KEY: ${TORBOX_API_KEY:-}
      # Disk ceiling for the torrent downloads and the converted video together. The box has a
      # fixed disk, and the volume below is the only thing that grows, so this leaves headroom
      # for the OS and the images.
      MAX_CACHE_BYTES: ${MAX_CACHE_BYTES:-12884901888}
    volumes:
      # Named volume rather than a bind mount: the cache is scratch data, and a named volume is
      # owned by Docker rather than by whatever user happens to exist on the host. Docker
      # initialises it from /data in the image, which belongs to the unprivileged user the
      # container runs as.
      - torrent-cache:/data
    # The health check is the image's own (`akidev-server --check`), run inside the container,
    # which is the only place these ports are reachable from. Nothing is published to the host.
    logging: *logging

  frontend:
    image: ${FRONTEND_IMAGE}
    build:
      context: .
      dockerfile: akidev-frontend/Dockerfile
      args:
        # Both are baked into the bundle at build time, so they are build arguments
        # rather than runtime variables. Changing either requires a rebuild. The site
        # domain is the same for every hostname, which is what lets one build serve all
        # of them.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_DOMAIN: ${NEXT_PUBLIC_SITE_DOMAIN:-akidev.live}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *logging

volumes:
  torrent-cache:
