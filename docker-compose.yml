# Akidev production stack: one server, three containers.
#
#   caddy          the only thing that publishes ports (80 and 443). It terminates TLS with its
#                  own Let's Encrypt certificates and routes by hostname (caddy/Caddyfile). The
#                  site and the API are proxied by Cloudflare; stream.<zone> is not, so video goes
#                  from this server to the viewer without passing through Cloudflare.
#   api            the REST API and the video delivery, one Rust binary built on the same
#                  library as the desktop app (port 9000, internal only).
#   frontend       every site (port 3000, internal only).
#
# The site talks to the API directly on api.akidev.live. Video URLs name stream.akidev.live
# when STREAM_URL is set.
#
# One container serves all of them. The bare zone is the site, with Anime, Series and Films
# tabs. anime. and tv. are retired: the middleware (src/middleware.ts) redirects them to the
# matching page of the bare zone, so old links keep working.
#
# Every value comes from the environment. The deploy script renders an env file from
# GitHub Actions secrets and passes it with --env-file, so no secret is ever written
# into this file or into the repository.

# The project name, the image names, /opt/konflix and the deploy user on the server date from
# before the rename to Akidev. They are names on the running host, so changing them is a server
# migration and not part of a rebrand.
name: konflix

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: ${NEXT_PUBLIC_SITE_DOMAIN:-akidev.live}
    volumes:
      # The folder, not the file: a deploy replaces the file, and a running container keeps
      # seeing the old one if only the file is mounted.
      - ./caddy:/etc/caddy:ro
      # The certificate and its account key. They must survive a redeploy: Let's Encrypt limits
      # how many certificates a hostname may be issued per week.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - frontend
    healthcheck:
      # Caddy's admin API answers on this port inside the container once its configuration is loaded.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging: &logging
      # Bounded, because the disk is a fixed size and a chatty container would
      # otherwise fill it. The default json-file driver has no limit.
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  api:
    image: ${API_IMAGE}
    build:
      # Only the Dockerfile and the binary the deploy workflow built into dist/. See the Dockerfile
      # for why it is not compiled here.
      context: desktop/server
    restart: unless-stopped
    environment:
      PORT: 9000
      # The public API origin.
      PUBLIC_URL: ${PUBLIC_URL}
      # The origin of the video URLs it hands out. Empty means the same as PUBLIC_URL.
      STREAM_URL: ${STREAM_URL:-}
      # Video one visitor may be sent in a day, in bytes. 0, the default, is no limit.
      MAX_STREAM_BYTES_PER_DAY: ${MAX_STREAM_BYTES_PER_DAY:-0}
      # The browser calls the API from the site, so that origin must be allowed.
      CORS_ORIGINS: https://${NEXT_PUBLIC_SITE_DOMAIN:-akidev.live}
      CACHE_DIR: /data
      STREAM_SOURCES: ${STREAM_SOURCES:-debrid,torrent,archive-org}
      TORBOX_API_KEY: ${TORBOX_API_KEY:-}
      # Watch parties: devices connect to each other, and this only helps them find the way. Empty
      # STUN_URLS means the public servers. CF_TURN_KEY_ID and CF_TURN_TOKEN are a Cloudflare Realtime
      # TURN key, the relay for devices on networks that block direct connections; without them
      # those devices cannot join.
      STUN_URLS: ${STUN_URLS:-}
      CF_TURN_KEY_ID: ${CF_TURN_KEY_ID:-}
      CF_TURN_TOKEN: ${CF_TURN_TOKEN:-}
      # Disk ceiling for the torrent downloads and the converted video together. The box has a
      # fixed disk, and the volume below is the only thing that grows, so this leaves headroom
      # for the OS and the images.
      MAX_CACHE_BYTES: ${MAX_CACHE_BYTES:-12884901888}
    volumes:
      # Named volume rather than a bind mount: the cache is scratch data, and a named volume is
      # owned by Docker rather than by whatever user happens to exist on the host. Docker
      # initialises it from /data in the image, which belongs to the unprivileged user the
      # container runs as.
      - torrent-cache:/data
    # The health check is the image's own (`akidev-server --check`), run inside the container,
    # which is the only place this port is reachable from. The api publishes nothing to the host.
    logging: *logging

  frontend:
    image: ${FRONTEND_IMAGE}
    build:
      context: .
      dockerfile: akidev-frontend/Dockerfile
      args:
        # Both are baked into the bundle at build time, so they are build arguments
        # rather than runtime variables. Changing either requires a rebuild. The site
        # domain is the same for every hostname, which is what lets one build serve all
        # of them.
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_SITE_DOMAIN: ${NEXT_PUBLIC_SITE_DOMAIN:-akidev.live}
        NEXT_PUBLIC_POSTHOG_TOKEN: ${NEXT_PUBLIC_POSTHOG_TOKEN:-}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # The server reports its own errors to PostHog with the same token.
      NEXT_PUBLIC_POSTHOG_TOKEN: ${NEXT_PUBLIC_POSTHOG_TOKEN:-}
      # Pages are rendered with their data in them, and the server that renders them asks the API
      # on the internal network rather than across the internet at its public address.
      API_INTERNAL_URL: http://api:9000
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *logging

volumes:
  torrent-cache:
  caddy-data:
  caddy-config:
