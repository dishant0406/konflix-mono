<!doctype html>
<meta charset="utf-8">
<!-- The installer window's background, 660x400 points. Rendered to background.png and
     background@2x.png by scripts/make-dmg-background.mjs; edit this, then run that. -->
<style>
  html, body { margin: 0; width: 660px; height: 400px; overflow: hidden; background: #0b0b0f;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
  .glow { position: absolute; inset: 0;
    background:
      radial-gradient(420px 260px at 180px 190px, rgba(61,220,151,.13), transparent 70%),
      radial-gradient(360px 240px at 560px 360px, rgba(61,220,151,.05), transparent 70%); }
  .dots { position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(rgba(255,255,255,.06) 1px, transparent 1.2px);
    background-size: 22px 22px; background-position: 11px 11px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 45%, #000 0%, transparent 78%); }
  .brand { position: absolute; top: 30px; left: 0; right: 0; text-align: center;
    font-size: 11px; font-weight: 700; letter-spacing: .42em; color: rgba(255,255,255,.34); }
  svg { position: absolute; left: 0; top: 0; }
  /* Finder draws the icon names in black whatever the picture, so each sits on a soft pill. */
  .pill { position: absolute; top: 252px; width: 116px; height: 24px; border-radius: 12px;
    background: rgba(214, 245, 229, .94); }
  .hint { position: absolute; bottom: 34px; left: 0; right: 0; text-align: center;
    font-size: 13px; color: rgba(255,255,255,.46); letter-spacing: .01em; }
  .hint b { color: #3ddc97; font-weight: 600; }
</style>
<div class="glow"></div>
<div class="dots"></div>
<div class="pill" style="left:122px"></div>
<div class="pill" style="left:422px"></div>
<div class="brand">AKIDEV</div>
<svg width="660" height="400" viewBox="0 0 660 400" fill="none">
  <defs>
    <linearGradient id="line" x1="250" y1="0" x2="410" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3ddc97" stop-opacity=".05"/>
      <stop offset="1" stop-color="#3ddc97" stop-opacity=".9"/>
    </linearGradient>
  </defs>
  <path d="M250 190 H402" stroke="url(#line)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 7"/>
  <path d="M396 183 L408 190 L396 197" stroke="#3ddc97" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<div class="hint">Drag <b>Akidev</b> into Applications</div>
