     posters (no real artwork) along the top and bottom edges. Rendered to background.png and

<style>

  .m { position: absolute; }
  /* the posters dissolve into the mint toward the middle, where the icons are */
  .wall { position: absolute; left: 0; right: 0; height: 120px; }
  .wall.top { top: 0; -webkit-mask-image: linear-gradient(180deg, #000 30%, transparent 100%); }
  .wall.bottom { bottom: 0; -webkit-mask-image: linear-gradient(0deg, #000 30%, transparent 100%); }
  svg { position: absolute; left: 0; top: 0; }
  .hint { position: absolute; top: 300px; left: 0; right: 0; text-align: center;
    font-size: 13px; font-weight: 500; color: rgba(11,11,15,.66); }
  .hint b { color: #0b0b0f; font-weight: 700; }
</style>
