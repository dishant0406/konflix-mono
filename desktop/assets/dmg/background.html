<!doctype html>
<meta charset="utf-8">
<!-- The installer window's background, 660x400 points. Rendered to background.png and
     background@2x.png by scripts/make-dmg-background.mjs; edit this, then run that.
     It is light on purpose: Finder draws the icon names in black over any picture. -->
<style>
  html, body { margin: 0; width: 660px; height: 400px; overflow: hidden; background: #f4f4f1;
    font-family: -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
  .glow { position: absolute; inset: 0;
    background:
      radial-gradient(380px 240px at 180px 190px, rgba(61,220,151,.20), transparent 72%),
      radial-gradient(300px 200px at 520px 340px, rgba(61,220,151,.07), transparent 72%); }
  .brand { position: absolute; top: 32px; left: 0; right: 0; text-align: center;
    font-size: 11px; font-weight: 700; letter-spacing: .42em; text-indent: .42em; color: rgba(11,11,15,.38); }
  svg { position: absolute; left: 0; top: 0; }
  .hint { position: absolute; bottom: 34px; left: 0; right: 0; text-align: center;
    font-size: 13px; color: rgba(11,11,15,.5); }
  .hint b { color: #14996a; font-weight: 600; }
</style>
<div class="glow"></div>
<div class="brand">AKIDEV</div>
<svg width="660" height="400" viewBox="0 0 660 400" fill="none">
  <defs>
    <linearGradient id="line" x1="250" y1="0" x2="410" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14996a" stop-opacity=".08"/>
      <stop offset="1" stop-color="#14996a" stop-opacity=".95"/>
    </linearGradient>
  </defs>
  <path d="M250 190 H402" stroke="url(#line)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 7"/>
  <path d="M396 183 L408 190 L396 197" stroke="#14996a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
<div class="hint">Drag <b>Akidev</b> into Applications</div>
